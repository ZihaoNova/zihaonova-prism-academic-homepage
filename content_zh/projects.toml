image = "/research/forest-carbon.png"
summary = "耦合土地覆盖变化、林龄动态与生态过程模型，开展亚热带森林碳储量反演与未来 NEP 情景预测及归因分析。"
description = """整合多源遥感监测、LUCC 情景模拟、林龄演变轨迹与生态过程模型（BIOME-BGC、InTEC），定量揭示气候变化、人类活动与林龄动态在 SSP-RCP 情景下对区域森林碳汇与碳通量的耦合调控机制。"""
