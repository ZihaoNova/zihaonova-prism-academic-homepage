date = "2020 - 至今"
role = "核心主线"
status = "核心专题"
home_featured = true
image = "/research/lucc-simulation.png"
summary = "耦合元胞自动机、神经网络与气候人类驱动因子，模拟不同气候与社会经济情景下的土地覆盖时空演变。"
description = """构建并应用 BPNN-CA-Markov、FLUS 及 PLUS-SD 等多情景土地利用模拟框架，整合多期遥感分类数据与气候地形协变量，预测 RCP 与 SSP 情景下的森林与景观格局动态。"""
