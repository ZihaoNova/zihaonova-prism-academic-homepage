[[items]]
id = "forest-carbon"
title = "Forest Carbon Storage & NEP Projection"
category = "themes"
category_label = "Research Theme"
subtitle = "BIOME-BGC / InTEC, PLS-SEM, SSP-RCP Scenarios"
date = "2023 - Present"
role = "Lead Researcher"
status = "Core Line"
featured = true
home_featured = true
image = "/research/forest-carbon.png"
summary = "Coupling LUCC, forest age dynamics, and ecological process models to project subtropical forest carbon storage and net ecosystem productivity."
description = """This research line integrates multi-source remote sensing, LUCC scenario modeling, forest aging trajectories, and process-based models (BIOME-BGC and InTEC) to quantify how climate change, human activities, and stand age jointly regulate regional forest carbon sinks and NEP dynamics under SSP-RCP pathways."""
tags = ["Forest Carbon", "NEP", "BIOME-BGC", "InTEC", "SSP-RCP"]

