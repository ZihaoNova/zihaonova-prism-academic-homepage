[[items]]
id = "forest-age"
title = "Forest Age Estimation from Disturbance & Recovery"
category = "themes"
category_label = "Research Theme"
subtitle = "LandTrendr / CCDC, Multi-spectral Time Series, ML"
date = "2021 - Present"
role = "Lead Researcher"
status = "Core Line"
home_featured = true
image = "/research/forest-age.png"
summary = "Time-series forest age mapping by fusing spectral disturbance/recovery trajectories with machine learning across subtropical forests."
description = """Constructs continuous pixel-level disturbance and recovery histories from Landsat time series using LandTrendr and CCDC-style change detection, coupled with random forest and deep learning models for spatially explicit forest age mapping."""
tags = ["Forest Age", "LandTrendr", "CCDC", "Random Forest"]

